<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Information System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>Student Information System</h1>
                <p>Sign in to your account</p>
            </div>
            
            <div id="alert" class="alert alert-danger" style="display: none;"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="Enter your username">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>
            
            <div class="login-footer">
                <a href="index.html" class="back-link">&larr; Back to Home</a>
            </div>
            
            <div class="demo-accounts">
                <h4>Demo Accounts:</h4>
                <p>Admin: <strong>admin</strong> / <strong>admin123</strong></p>
                <p>Teacher: <strong>jdoe</strong> / <strong>teach123</strong></p>
                <p>Student: <strong>yash</strong> / <strong>pass123</strong></p>
            </div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
